# Postfix SPF Policy Server Configuration
# Copy to /etc/postfix/postfix-spf-policy.conf

# Network settings
listen_address = 127.0.0.1
listen_port = 10033

# Cache settings
# Maximum number of cached SPF results
cache_max_size = 10000
# Cache TTL in seconds (default: 5 minutes)
cache_ttl = 300

# DNS settings
# Timeout for DNS lookups in seconds
dns_timeout = 10

# Local domains configuration
# SPF checks are skipped for senders from local domains
# Use ONE of the following options:

# Option 1: Postfix-style MySQL config file
# domains_database_config = /etc/postfix/mysql-virtual-domains.cf

# Option 2: Flat file with domains (one per line)
# domains_file = /etc/postfix/local-domains.txt

# Reload interval for domains in seconds (default: 5 minutes)
reload_interval = 300

# Tolerant mode - apply heuristics to reduce false positives
# When enabled, the server applies heuristics for common misconfigurations:
# - PTR record with SPF pass on PTR domain
# - Known ESP shared infrastructure
# - SPF records that reference other domains
# Values: yes, no, true, false, 1, 0, on, off (default: yes)
tolerant_mode = yes

# Logging
# Log level: debug, info, warn, error
log_level = info

# PID file location
pidfile = /var/run/postfix-spf-policy.pid

# Connection timeout in seconds
connection_timeout = 30
